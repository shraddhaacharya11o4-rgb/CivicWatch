<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Upload | CivicWatch</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <a href="{% url 'showindex' %}" class="logo">
      <div class="logo-icon">
        <img src="{% static 'logo.png' %}" width="70" height="50">
      </div>

      <div class="logo-text">
        Civic Watch
        <span>Government of Karnataka</span>
      </div>
    </a>

    <ul class="nav-links">
      {% include 'public_menu.html' %}
    </ul>
  </nav>

  <!-- ── Document Upload Section ── -->
  <section class="auth-page simp">
    <div class="auth-card fade-up" style="max-width:500px;">
      <h2>Document Upload</h2>
      <p class="subtitle">
        Upload grievance related supporting documents
      </p>

      <!-- Django Form -->
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label>User</label>
          <input type="text" name="t1" value="{{ username }}" readonly required>
        </div>

        <div class="form-group">
          <label>Grievance ID</label>
          <select name="t2" required>
            <option value="" disabled selected>-- Select Grievance --</option>
            {% for g in grievances %}
            <option value="{{ g.grievance_id }}">
              {{ g.grievance_id }} - {{ g.title }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Document Type</label>
          <select name="t3" required>
            <option value="" disabled selected>-- Select Document Type --</option>
            <option value="Evidence Photo">Evidence Photo</option>
            <option value="Proof Document">Proof Document</option>
            <option value="Supporting Document">Supporting Document</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="t4" placeholder="Briefly describe this document" required></textarea>
        </div>

        <div class="form-group">
          <label>Upload Document</label>
          <input type="file" name="t5" accept=".pdf,.jpg,.jpeg,.png" required>
          <small style="color:#777;">Accepted formats: PDF, JPG, JPEG, PNG | Maximum size: 5 MB</small>
        </div>

        <button type="submit" class="btn-submit">
          Upload Document
        </button>

      </form>

    </div>

  </section>
  {% if msg %}
  <script>
    alert("{{ msg }}");
  </script>
  {% endif %}

</body>

</html>
