<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CivicWatch</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">

    <a href="{% url 'showindex' %}" class="logo">

      <div class="logo-icon">
        <img src="{% static 'logo.png' %}" width="70" height="50">
      </div>

      <div class="logo-text">
        Civic Watch
        <span>Government of Karnataka</span>
      </div>

    </a>

    <ul class="nav-links">
      <li><a href="{% url 'showindex' %}">Home</a></li>
      <li><a href="{% url 'logcheck' %}" class="btn-login">Login</a></li>

    </ul>

  </nav>

  <!-- ── Forgot Password Section ── -->
  <section class="auth-page simp">

    <div class="auth-card fade-up" style="max-width:450px;">

      <h2>Forgot Password</h2>

      <p class="subtitle">
        Enter your username or email to continue
      </p>

      <!-- Django Form -->
      <form method="POST">

        {% csrf_token %}

        <div class="form-group">

          <label> Enter Username or Email
          </label>

          <input
            type="email"
            name="t1"
            placeholder="Enter your email address"
            required
          >

        </div>

        <button type="submit" class="btn-submit">
          Submit
        </button>

      </form>

    </div>

  </section>

</body>

</html>
