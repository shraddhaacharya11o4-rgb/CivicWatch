<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grievance Update | CivicWatch</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <a href="{% url 'showindex' %}" class="logo">
      <div class="logo-icon">
        <img src="{% static 'logo.png' %}" width="70" height="50">
      </div>
      <div class="logo-text">
        Civic Watch
        <span>Government of Karnataka</span>
      </div>
    </a>

    <ul class="nav-links">
      {% include 'officer_menu.html' %}
    </ul>
  </nav>

  <!-- ── Grievance Update Section ── -->
  <section class="auth-page simp">
    <div class="auth-card fade-up" style="max-width:550px;">
      <h2>Grievance Update</h2>
      <p class="subtitle">
        Update grievance progress and upload status details
      </p>

      <!-- Django Form -->
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label>Grievance ID</label>
          <select name="t1" required>
            <option value="" disabled selected>
              -- Select Grievance --
            </option>
            {% for g in grievances %}
            <option value="{{ g.grievance_id }}">
              {{ g.grievance_id }} - {{ g.title }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Officer</label>
          <select name="t2" required>
          <option value="">Select Officer</option>
            <option>Rahul Patil</option>
            <option>Priya Sharma</option>
            <option>Amit Kumar</option>
            <option>Sneha Joshi</option>
            <option>Ramesh Gowda</option>
            <option>Anjali Desai</option>
          </select>
        </div>

        <div class="form-group">
          <label>Update Date</label>
          <input type="date" name="t3" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="t4" placeholder="Enter update description" required minlength="5"></textarea>
        </div>

        <div class="form-group">
          <label>Upload Photo</label>
          <input type="file" name="t5">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select name="t6" required>
            <option value="" disabled selected>-- Select --</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress </option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Update</button>
      </form>
    </div>
  </section>
</body>
</html>
