<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure Monitoring | CivicWatch</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">

    <a href="{% url 'showindex' %}" class="logo">

      <div class="logo-icon">
        <img src="{% static 'logo.png' %}" width="70" height="50">
      </div>

      <div class="logo-text">
        Civic Watch
        <span>Government of Karnataka</span>
      </div>

    </a>

    <ul class="nav-links">
      {% include "officer_menu.html" %}
    </ul>

  </nav>

  <!-- ── Infrastructure Monitoring Section ── -->
  <section class="auth-page simp">

    <div class="auth-card fade-up" style="max-width:550px;">

      <h2>Infrastructure Monitoring</h2>

      <p class="subtitle">
        Monitor infrastructure assets and inspection reports
      </p>

      <!-- Django Form -->
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label>Asset</label>
          <select name="t1" required>
            <option value="" disabled selected>-- Select Asset --</option>
            {% for asset in assets %}
              <option value="{{ asset.asset_name }}">
                {{ asset.asset_name }} - {{ asset.asset_type }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Monitored By</label>
          <select name="t2" required>
            <option value="">Select Officer</option>
            <option>Rahul Patil</option>
            <option>Priya Sharma</option>
            <option>Amit Kumar</option>
            <option>Sneha Joshi</option>
            <option>Ramesh Gowda</option>
            <option>Anjali Desai</option>
          </select>
        </div>

        <div class="form-group">
          <label>Inspection Date</label>
          <input type="date" name="t3" required>
        </div>

        <div class="form-group">
          <label>Condition Report</label>
          <select name="t4" required>
            <option value="">Select Condition</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
            <option>Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Defects Found</label>
            <textarea name="t5" placeholder="Describe defects"></textarea>
        </div>

        <div class="form-group">
          <label>Upload Photo</label>
          <input type="file" name="t6" accept="image/*" required>
        </div>

        <div class="form-group">
          <label>Action Taken</label>
          <select name="t7">
            <option>Pending</option>
            <option>Temporary Repair</option>
            <option>Maintenance Scheduled</option>
            <option>Completed</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">
          Submit
        </button>

      </form>
    </div>
  </section>
</script>
{% if msg %}
<script>
    alert("{{ msg }}");
</script>
{% endif %}
</body>

</html>
